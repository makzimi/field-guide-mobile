// Adapted from Drinkit's shared preview-to-screenshot setup.
apply plugin: 'io.github.takahirom.roborazzi'

android {
    testOptions.unitTests.includeAndroidResources = true
    testOptions.unitTests.all {
        systemProperty 'robolectric.graphicsMode', 'NATIVE'
        systemProperty 'robolectric.pixelCopyRenderMode', 'hardware'
    }
}

dependencies {
    implementation 'androidx.compose.ui:ui-tooling-preview'
    debugImplementation 'androidx.compose.ui:ui-tooling'
    debugImplementation 'androidx.compose.ui:ui-test-manifest'
    testImplementation 'androidx.compose.ui:ui-test-junit4'
    testImplementation 'org.robolectric:robolectric:4.17'
    testImplementation 'io.github.sergio-sastre.ComposablePreviewScanner:android:0.4.0'
    testImplementation 'io.github.takahirom.roborazzi:roborazzi:1.39.0'
    testImplementation 'io.github.takahirom.roborazzi:roborazzi-compose:1.39.0'
    testImplementation 'io.github.takahirom.roborazzi:roborazzi-compose-preview-scanner-support:1.39.0'
}

roborazzi {
    outputDir.set(layout.projectDirectory.dir('src/test/screenshots'))
    generateComposePreviewRobolectricTests.enable.set(true)
    generateComposePreviewRobolectricTests.packages.set([android.namespace])
    generateComposePreviewRobolectricTests.includePrivatePreviews.set(true)
    generateComposePreviewRobolectricTests.robolectricConfig.set([sdk: '[35]', qualifiers: '"w320dp-h240dp-mdpi"'])
}

// A deliberate record must always execute, even after a failed verification.
if (gradle.startParameter.taskNames.any { it.toLowerCase().contains('recordroborazzi') }) {
    tasks.withType(Test).configureEach {
        outputs.upToDateWhen { false }
        outputs.cacheIf { false }
    }
}
